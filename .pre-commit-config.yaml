# See https://pre-commit.com/ for usage and config
exclude: '^deprecated/'

repos:
- repo: local
  hooks:
  - id: isort
    name: isort
    stages: [pre-commit]
    language: system
    entry: isort
    types: [python]

  - id: black
    name: black
    stages: [pre-commit]
    language: system
    entry: black
    types: [python]
    args: ["--line-length", "80"]

  - id: pylint
    name: pylint
    stages: [pre-commit]
    entry: pylint
    language: system
    types: [python]
    args:
      [
        "-rn", # Only display messages
        "-sn", # Don't display the score
        "--rcfile=.pylintrc",
        "--disable=R0917"
      ]
