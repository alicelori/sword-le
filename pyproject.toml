[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]

[project]
name = "sword-le"
version = "0.1.0"
readme = "README.md"
description = "Geospatial processing pipeline designed to industrialize the selection, correction, and merging reaches"
authors = [ ]
requires-python = ">=3.10"

dependencies = [
  "geopandas>=1.1.2",
  "shapely>=2.1.2",
  "fiona>=1.10.1",
  "pyproj>=3.7.1",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "matplotlib>=3.10.8",
  "tqdm>=4.67.1",
  "geopy>=2.4.1",
  "pytest>=8.2"
]

[project.optional-dependencies]
dev =[
    "black==25.1.0",
    "isort==6.0.1",
    "pre-commit",
    "pylint",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
